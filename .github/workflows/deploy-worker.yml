name: Deploy Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BLITZ_KEY: ${{ secrets.BLITZREELS_API_KEY || secrets.BLITZREELS_API_KEYS }}
      APP_SHARED_SECRET: ${{ secrets.APP_SHARED_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install

      - name: Sanity check secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"  || { echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret missing"; exit 1; }
          test -n "$BLITZ_KEY" || { echo "::error::Add the BLITZREELS_API_KEY secret (br_live_...)"; exit 1; }
          test -n "$APP_SHARED_SECRET" || { echo "::error::APP_SHARED_SECRET secret missing"; exit 1; }

      - name: Upload secrets to the Worker
        run: |
          printf '%s' "$BLITZ_KEY" | npx wrangler secret put BLITZREELS_API_KEY
          printf '%s' "$APP_SHARED_SECRET" | npx wrangler secret put APP_SHARED_SECRET

      - name: Remove the retired multi-key secret
        run: npx wrangler secret delete BLITZREELS_API_KEYS --force || true

      - name: Pin the video model when provided
        if: ${{ vars.VIDEO_MODEL != '' }}
        run: |
          sed -i 's|^VIDEO_MODEL = ""|VIDEO_MODEL = "${{ vars.VIDEO_MODEL }}"|' wrangler.toml
          grep VIDEO_MODEL wrangler.toml

      - name: Deploy
        run: npx wrangler deploy 2>&1 | tee deploy.log

      - name: Show the URL and run a health check
        run: |
          URL=$(grep -Eo 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1)
          echo "Worker URL: $URL"
          {
            echo "### Worker deployed"
            echo
            echo "**URL:** \`$URL\`"
            echo
            echo '```json'
            sleep 5
            curl -s "$URL/v1/health" || echo "health check failed"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
