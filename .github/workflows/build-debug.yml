name: Build Debug APK

# Phone testing build. No keystore and no secrets needed: the debug key is
# generated by Flutter and the proxy URL is baked into lib/core/config.dart.
# Runs automatically on every push to main and publishes the APK as a release
# so it can be downloaded from one stable link.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: stable

      - name: Dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Collect the APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-debug.apk out/solu-ai-debug.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: solu-debug-apk
          path: out/solu-ai-debug.apk
          retention-days: 14

      - name: Publish as a release so the APK has a stable link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Solu AI - latest test build
          body: |
            Debug APK for phone testing. Install it directly on Android.
            Backend: https://solu-ai-proxy.sagarvagoni62.workers.dev
          files: out/solu-ai-debug.apk
          prerelease: true
