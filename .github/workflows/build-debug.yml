name: Build Debug APK

# Phone testing build. The app key is never committed: it is injected here from
# the SOLU_APP_KEY (or APP_SHARED_SECRET) repository secret, so this repo can be
# public without handing anyone access to the backend.
# Runs automatically on every push to main and publishes the APK as a release
# so it can be downloaded from one stable link.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SOLU_APP_KEY: ${{ secrets.SOLU_APP_KEY || secrets.APP_SHARED_SECRET }}
      SOLU_PROXY: ${{ vars.SOLU_PROXY || 'https://solu-ai-proxy.sagarvagoni62.workers.dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the app key secret
        run: |
          test -n "$SOLU_APP_KEY" || { echo "::error::Add the SOLU_APP_KEY secret (same value as APP_SHARED_SECRET on the Worker)"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: stable

      - name: Dependencies
        run: flutter pub get

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SOLU_PROXY="$SOLU_PROXY" \
            --dart-define=SOLU_APP_KEY="$SOLU_APP_KEY"

      - name: Collect the APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-debug.apk out/solu-ai-debug.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: solu-debug-apk
          path: out/solu-ai-debug.apk
          retention-days: 14

      - name: Publish as a release so the APK has a stable link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Solu AI - latest test build
          body: |
            Debug APK for phone testing. Install it directly on Android.
            Backend: https://solu-ai-proxy.sagarvagoni62.workers.dev
          files: out/solu-ai-debug.apk
          prerelease: true
