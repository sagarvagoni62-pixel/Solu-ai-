name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: stable

      - name: Check secrets
        run: |
          test -n "${{ secrets.SOLU_PROXY }}"   || { echo "::error::SOLU_PROXY secret missing"; exit 1; }
          test -n "${{ secrets.SOLU_APP_KEY }}" || { echo "::error::SOLU_APP_KEY secret missing"; exit 1; }

      - name: Dependencies
        run: flutter pub get

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SOLU_PROXY=${{ secrets.SOLU_PROXY }} \
            --dart-define=SOLU_APP_KEY=${{ secrets.SOLU_APP_KEY }}

      - name: Collect the APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-debug.apk out/solu-ai-debug.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: solu-debug-apk
          path: out/solu-ai-debug.apk
          retention-days: 14
